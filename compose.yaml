services:
  api:
    build:
      context: ./backend
    environment:
      SPRINTLY_ADDR: ":8080"
      SPRINTLY_DATA: /app/data/issues.json
    volumes:
      - sprintly-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 5s
      timeout: 2s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: .
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sprintly-data:
